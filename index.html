<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Howl-arts: Learn ASL with Wizard Dogs</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐶</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--night:#1a1533;--deep:#261e4a;--card:#33296280;--moon:#f6ecd4;--gold:#ffbf47;--mint:#62d6b8;--rose:#ff7a90;--ink:#d9d2f2}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(circle at 20% 0,#3b2c7a 0,var(--night) 55%) fixed;color:var(--moon);font:500 17px/1.5 Nunito,system-ui,sans-serif;padding:20px 16px 60px}
main{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:Cinzel,Georgia,serif;margin:0}
h1{font-size:clamp(34px,8vw,58px);font-weight:900;color:var(--gold);line-height:1.05;text-shadow:0 3px 0 #6b3d00}
.sub{color:var(--ink);max-width:56ch}
.hero{display:flex;gap:18px;align-items:center;margin:18px 0 26px}
.hero .big{font-size:84px;filter:drop-shadow(0 6px 0 #0006);animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-4deg)}}
.lvl{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);border:2px solid #6f5fc4;border-radius:18px;padding:14px 16px;margin:0 0 12px;color:inherit;font:inherit;cursor:pointer}
.lvl:hover:not(:disabled){border-color:var(--gold)}
.lvl:disabled{opacity:.45;cursor:not-allowed}
.lvl .av{font-size:44px}
.lvl h3{font-size:19px}
.lvl small{color:var(--ink)}
.stars{margin-left:auto;font-size:22px;white-space:nowrap;color:var(--gold)}
button{font:inherit}
button:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.back{background:none;border:2px solid #6f5fc4;color:var(--ink);border-radius:12px;padding:6px 12px;cursor:pointer}
.mana{letter-spacing:3px;font-size:22px}
.prog{height:10px;background:#0005;border-radius:9px;overflow:hidden;margin-bottom:18px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--gold));width:0;transition:width .4s}
.dog{display:flex;gap:14px;align-items:flex-start;margin-bottom:16px}
.dog .av{font-size:62px;line-height:1}
.say{background:var(--moon);color:#2b2150;border-radius:6px 20px 20px 20px;padding:12px 16px;font-weight:700;flex:1}
.scroll{background:#f6ecd4;color:#2b2150;border-radius:14px;padding:16px 18px;margin-bottom:16px;border:3px double #b9964b}
.scroll b{font-family:Cinzel,serif}
.scroll ol{margin:8px 0 0;padding-left:22px}
.scroll li{margin:4px 0}
.opts{display:grid;gap:10px}
.opt{background:var(--deep);color:var(--moon);border:2px solid #6f5fc4;border-radius:14px;padding:12px 16px;text-align:left;cursor:pointer}
.opt:hover:not(:disabled){background:#3a2f70}
.opt.ok{background:#14654f;border-color:var(--mint)}
.opt.bad{background:#7a2236;border-color:var(--rose)}
.opt:disabled{cursor:default}
.next{margin-top:16px;background:var(--gold);color:#3b2400;border:0;border-radius:14px;padding:12px 22px;font-weight:800;cursor:pointer}
.fb{margin-top:14px;min-height:28px;font-weight:700}
.fb a{color:var(--mint)}
.end{text-align:center;padding:20px 0}
.end .av{font-size:90px}
.end .stars{font-size:46px;margin:6px 0 14px;display:block}
.foot{margin-top:30px;color:var(--ink);font-size:14px}
.foot a{color:var(--mint)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<script>
// ---------- Sign dictionary: each sign is described as a "spell" (hand movement) ----------
var D={
hello:"Flat hand at your forehead like a salute, then swing it outward.",
yes:"Make a fist and nod it up and down, like a head nodding.",
no:"Tap your index and middle fingers against your thumb, like a beak snapping shut.",
name:"Two H-hands (index and middle fingers together). Tap the right on top of the left, in an X.",
sign:"Both index fingers point at each other and circle in alternating loops.",
please:"Flat hand rubs in a circle on your chest.",
thankyou:"Fingertips touch your chin, then your hand moves forward and down toward the person.",
sorry:"A-hand (fist, thumb on the side) rubs in a circle on your chest.",
eat:"Bunched fingertips tap your mouth, as if feeding yourself.",
drink:"Hold a C-shape like a cup and tip it toward your mouth.",
help:"Fist rests on your flat palm; lift both hands up together.",
more:"Bunch the fingertips of both hands and tap them together.",
home:"Bunched fingertips touch the corner of your mouth, then your cheek.",
friend:"Hook your index fingers together, then flip and hook again the other way.",
love:"Cross both fists over your heart.",
water:"W-hand (three fingers up) taps your chin.",
stop:"Flat hand chops down onto your other flat palm.",
want:"Both hands, claw-shaped and palms up, pull toward your body.",
airplane:"Y-hand with the index finger extended glides up and away like a plane taking off.",
car:"Both fists grip an imaginary steering wheel and turn it.",
train:"Two fingers (H) slide back and forth across two fingers of the other hand, like a train on tracks.",
where:"Index finger up, wag it side to side while looking puzzled.",
go:"Both index fingers point and arc forward together.",
come:"Both index fingers beckon, curling toward your body.",
bathroom:"T-hand (fist, thumb between fingers) shakes side to side.",
money:"Bunched fingertips of one hand tap against your other palm.",
me:"Point your index finger at your own chest.",
you:"Point your index finger at the other person.",
what:"Both palms up, shaking slightly side to side with a questioning face."
};
var L={A:"Fist with the thumb resting along the side.",B:"Flat hand, fingers up and together, thumb folded across the palm.",C:"Curve your hand into the shape of the letter C.",D:"Index finger straight up; other fingers touch the thumb in a circle.",I:"Fist with only the pinky finger up.",L:"Index finger up and thumb out, making an L.",O:"All fingertips meet the thumb, forming an O.",V:"Index and middle fingers up and spread, like a peace sign.",W:"Index, middle and ring fingers up and spread.",Y:"Thumb and pinky out, other fingers curled (hang loose)."};
var LN={hello:"Hello",yes:"Yes",no:"No",name:"Name",sign:"Sign",please:"Please",thankyou:"Thank you",sorry:"Sorry",eat:"Eat",drink:"Drink",help:"Help",more:"More",home:"Home",friend:"Friend",love:"Love",water:"Water",stop:"Stop",want:"Want",airplane:"Airplane",car:"Car",train:"Train",where:"Where",go:"Go",come:"Come",bathroom:"Bathroom",money:"Money"};
function words(keys){return keys.map(function(k){return{w:LN[k],d:D[k],slug:k==="thankyou"?"thank-you":k}})}
function letters(){return Object.keys(L).map(function(k){return{w:"Letter "+k,d:L[k],slug:"fingerspelling-"+k.toLowerCase()}})}
var S=[
{k:["you","name","what"],m:"What is your name?"},
{k:["me","want","water","please"],m:"I want water, please."},
{k:["where","bathroom"],m:"Where is the bathroom?"},
{k:["friend","go","home"],m:"My friend is going home."},
{k:["me","go","airplane"],m:"I am going on an airplane."},
{k:["you","want","eat","what"],m:"What do you want to eat?"},
{k:["me","love","friend"],m:"I love my friend."},
{k:["you","come","home","please"],m:"Please come home."}
];
var LV=[
{n:"Puppy Spellbook",av:"🐶",dog:"Professor Biscuit (Golden Retriever)",desc:"First greetings",items:words(["hello","yes","no","name","sign","please","thankyou","sorry"]),hi:"Welcome, apprentice! Every spell begins with a greeting. Watch my paws, er, hands."},
{n:"The Alphabet Runes",av:"🐩",dog:"Madame Poodle-Sage (Poodle)",desc:"Fingerspelling handshapes",items:letters(),hi:"Ten runes guard the gate. Learn their handshapes and the door will open."},
{n:"Potions & Pantry",av:"🦮",dog:"Sir Fetchalot (Labrador)",desc:"Everyday words",items:words(["eat","drink","help","more","home","friend","love","water","stop","want"]),hi:"Even wizards get hungry. Let's brew some everyday vocabulary!"},
{n:"The Wandering Portal",av:"🐕‍🦺",dog:"Captain Howler (Husky)",desc:"Travel words",items:words(["airplane","car","train","where","go","come","bathroom","money"]),hi:"Adventure awaits beyond the portal. Travel signs will get you across any realm."},
{n:"The Grand Incantations",av:"🐺",dog:"Archmage Moonpaw (Wolfhound)",desc:"Full sentences",sent:true,hi:"The final trial. I'll show a chain of signs. Read the whole spell and tell me what it means."}
];
// ---------- State ----------
var P={};
try{P=JSON.parse(localStorage.getItem("howlarts")||"{}")}catch(e){}
function save(){try{localStorage.setItem("howlarts",JSON.stringify(P))}catch(e){}}
function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
var app=document.getElementById("app");
var G=null;
// ---------- Views ----------
function home(){
G=null;
var h='<div class="hero"><div class="big">🧙‍♂️🐕</div><div><h1>Howl-arts</h1><p class="sub">A school of magic where your teachers are wizard dogs. Read each sign, pick the right meaning, and keep your mana to pass each trial. Learn American Sign Language one spell at a time.</p></div></div>';
LV.forEach(function(l,i){
var open=i===0||(P[i-1]||0)>0,st=P[i]||0;
h+='<button class="lvl" '+(open?'':'disabled')+' data-i="'+i+'"><span class="av">'+l.av+'</span><span><h3>Level '+(i+1)+': '+l.n+'</h3><small>'+(open?l.desc+' with '+l.dog:'Pass the previous trial to unlock')+'</small></span><span class="stars">'+(open?"★".repeat(st)+"☆".repeat(3-st):"🔒")+'</span></button>';
});
h+='<p class="foot">Signs here are described in words. To see each one in motion, tap the "watch it" link after every answer, or try <a href="https://www.lifeprint.com" target="_blank" rel="noopener">Lifeprint</a>. Your progress is saved in this browser.</p>';
app.innerHTML=h;
app.querySelectorAll(".lvl").forEach(function(b){b.onclick=function(){start(+b.dataset.i)}});
}
function build(i){
var l=LV[i],q=[];
if(l.sent){
var pool=S.map(function(s){return s.m});
sh(S).slice(0,6).forEach(function(s){
var wr=sh(pool.filter(function(m){return m!==s.m})).slice(0,3);
q.push({type:"sent",steps:s.k.map(function(k){return D[k]}),opts:sh([s.m].concat(wr)),ans:s.m,slug:null});
});
}else{
var it=sh(l.items).slice(0,8);
it.forEach(function(x){
var others=l.items.filter(function(y){return y!==x});
if(Math.random()<.6){
q.push({type:"d2w",desc:x.d,opts:sh([x.w].concat(sh(others).slice(0,3).map(function(y){return y.w}))),ans:x.w,slug:x.slug});
}else{
q.push({type:"w2d",word:x.w,opts:sh([x.d].concat(sh(others).slice(0,2).map(function(y){return y.d}))),ans:x.d,slug:x.slug});
}
});
}
return q;
}
function start(i){G={i:i,q:build(i),n:0,mana:3,right:0};play()}
function play(){
var l=LV[G.i],q=G.q[G.n];
var h='<div class="bar"><button class="back" id="bk">Leave trial</button><span class="mana" aria-label="Mana remaining">'+"💜".repeat(G.mana)+"🖤".repeat(3-G.mana)+'</span></div>';
h+='<div class="prog"><i style="width:'+(G.n/G.q.length*100)+'%"></i></div>';
var say=q.type==="d2w"?"Which word does this spell cast?":q.type==="w2d"?"Which hand movement makes this sign?":"Read the whole spell, step by step. What does it say?";
if(G.n===0)say=l.hi;
h+='<div class="dog"><div class="av">'+l.av+'🪄</div><div class="say">'+say+'</div></div>';
if(q.type==="d2w")h+='<div class="scroll"><b>The sign:</b><br>'+q.desc+'</div>';
else if(q.type==="w2d")h+='<div class="scroll"><b>Find the sign for:</b> '+q.word+'</div>';
else h+='<div class="scroll"><b>The spell, in order:</b><ol>'+q.steps.map(function(s){return'<li>'+s+'</li>'}).join("")+'</ol></div>';
h+='<div class="opts">'+q.opts.map(function(o,k){return'<button class="opt" data-k="'+k+'">'+o+'</button>'}).join("")+'</div><div class="fb" id="fb" aria-live="polite"></div><div id="nx"></div>';
app.innerHTML=h;
document.getElementById("bk").onclick=home;
app.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){pick(b,q)}});
}
function pick(b,q){
var good=q.opts[+b.dataset.k]===q.ans;
app.querySelectorAll(".opt").forEach(function(o){o.disabled=true;if(q.opts[+o.dataset.k]===q.ans)o.classList.add("ok")});
var fb=document.getElementById("fb");
var link=q.slug?' <a href="https://www.signasl.org/sign/'+q.slug+'" target="_blank" rel="noopener">Watch it</a>':"";
if(good){G.right++;fb.innerHTML="✨ Spell cast! Well done."+link}
else{b.classList.add("bad");G.mana--;fb.innerHTML="💥 The spell fizzled. The right answer is highlighted."+link}
var last=G.n===G.q.length-1;
var nx=document.getElementById("nx");
nx.innerHTML='<button class="next">'+((G.mana<=0||last)?"Continue":"Next spell")+'</button>';
nx.firstChild.onclick=function(){G.n++;if(G.mana<=0||G.n>=G.q.length)finish();else play()};
nx.firstChild.focus();
}
function finish(){
var l=LV[G.i],won=G.mana>0,st=0;
if(won)st=G.mana===3?3:G.mana===2?2:1;
if(won&&st>(P[G.i]||0)){P[G.i]=st;save()}
var h='<div class="end"><div class="av">'+(won?l.av+"🎉":"😵‍💫")+'</div><h2>'+(won?"Trial passed!":"Out of mana")+'</h2><span class="stars">'+"★".repeat(st)+"☆".repeat(3-st)+'</span><p>'+(won?G.right+" of "+G.q.length+" spells cast.":"Rest up and try again. "+l.dog.split(" (")[0]+" believes in you.")+'</p>';
if(won&&G.i<LV.length-1)h+='<button class="next" id="a">Next trial</button> ';
if(won&&G.i===LV.length-1)h+='<p><b>You finished Howl-arts. You are an Archmage of ASL! 🧙‍♂️</b></p>';
h+='<button class="back" id="r">'+(won?"Replay":"Try again")+'</button> <button class="back" id="m">Map</button></div>';
app.innerHTML=h;
var i=G.i;
if(document.getElementById("a"))document.getElementById("a").onclick=function(){start(i+1)};
document.getElementById("r").onclick=function(){start(i)};
document.getElementById("m").onclick=home;
}
home();
</script>
</body>
</html>
